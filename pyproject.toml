[project]
name = "auto-test-platform"
version = "0.1.0"
description = "Enterprise Automation Testing Platform - Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web Framework
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic[email]==2.9.2",
    "pydantic-settings==2.5.2",
    # Database
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.29.0",
    "alembic==1.13.3",
    # Auth
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    # Utilities
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx==0.27.2",
    "aiosqlite==0.20.0",
    "email-validator==2.2.0",
    "black==24.8.0",
    "isort==5.13.2",
    "mypy==1.11.2",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src/app"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
# Show lines missing coverage (so PRs can find the gap).
show_missing = true
# Skip 100%-covered files in the terminal report for brevity.
skip_covered = false
# Per TEST_STRATEGY §7: MVP target is service ≥ 80% / engine ≥ 90%.
# 2026-09-23 baseline = 79% (515 tests, 0 regressions). We start at
# 78% to leave a 1% safety margin against PR noise and plan to raise
# to 80% / 90% in subsequent sprints (BACKLOG F025+).
fail_under = 78
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
